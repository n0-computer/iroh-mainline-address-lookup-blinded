[package]
name = "iroh-mainline-address-lookup-blinded"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "POC: iroh address lookup via BEP44 mutable items under Tor-style blinded keys"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/n0-computer/iroh-mainline-address-lookup-blinded"
homepage = "https://github.com/n0-computer/iroh-mainline-address-lookup-blinded"
documentation = "https://docs.rs/iroh-mainline-address-lookup-blinded"
keywords = ["iroh", "dht", "mainline", "privacy", "address-lookup"]
categories = ["network-programming"]
rust-version = "1.91"

[lints.rust]
missing_debug_implementations = "warn"

[lints.clippy]
unused-async = "warn"

[dependencies]
iroh = { version = "1.0.0", default-features = false }
n0-mainline = "0.6"
n0-future = "0.3.2"
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2.2", features = ["hazmat"] }
curve25519-dalek = "4"
sha2 = "0.10"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.49", default-features = false, features = ["rt", "sync", "time", "macros"] }
thiserror = "2"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "signal"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing-subscriber = "0.3"

[package.metadata.docs.rs]
all-features = true
